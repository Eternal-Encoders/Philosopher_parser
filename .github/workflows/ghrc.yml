name: Latest Image

on:
    push:
        branches:
          - main

jobs:
    build_and_publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Build an push an image
              run: |
                docker login --username Roaoch --password ${{ secrets.PACKAGER }} ghcr.io
                docker build . --tag ghcr.io/eternal-encoders/philosopher-parser:latest
                docker push ghcr.io/eternal-encoders/philosopher-parser:latest
    build_and_push:
        needs: build_and_publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 
              uses: actions/checkout@v6
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and push
              uses: docker/build-push-action@v4
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: ${{ secrets.DOCKER_HUB_USERNAME }}/philosophy_parser:latest